general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot      # capture floutée de l'écran, ou chemin vers une image
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(88c0d0)
    inner_color = rgb(2e3440)
    font_color = rgb(eceff4)
    placeholder_text = <i>Mot de passe…</i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = rgb(eceff4)
    position = 0, 80
    halign = center
    valign = center
}
